<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Pinyon+Script&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b1f4d; --blue:#1d4fa8; --sky:#6fb1ff; --ice:#dff0ff;
    --silver:#b9c8e6; --card:#f5faff; --ink:#14284f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{overflow-x:hidden}
  body{font-family:'Cormorant Garamond',Georgia,serif;color:var(--ink);background:#050f2b;overflow-x:hidden}

  /* ---------- background + stars (fixed) ---------- */
  #bg{position:fixed;inset:0;z-index:0;
    background:radial-gradient(ellipse at 50% 30%,#1c4a9c 0%,#0f2a66 45%,#050f2b 100%)}
  .star{position:fixed;z-index:1;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.8;pointer-events:none;
    animation:twinkle 3s ease-in-out infinite}
  @keyframes twinkle{50%{opacity:.1;transform:scale(.6)}}
  #progress{position:fixed;left:0;top:0;height:3px;width:0;z-index:40;
    background:linear-gradient(90deg,var(--sky),#fff);box-shadow:0 0 10px var(--sky)}

  /* ---------- butterflies ---------- */
  .bf{position:fixed;left:0;top:0;pointer-events:none;z-index:30;will-change:transform}
  .bf svg{display:block;overflow:visible}
  .wings{transform-origin:50px 50px;animation:flap var(--flap,.3s) ease-in-out infinite alternate}
  @keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.18)}}

  /* ---------- side navigation ---------- */
  #dots{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:35;display:flex;flex-direction:column;gap:14px;opacity:0}
  #dots button{position:relative;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ice);background:transparent;cursor:pointer;
    transition:.3s;padding:0}
  #dots button.on{background:var(--sky);box-shadow:0 0 12px var(--sky);transform:scale(1.35)}
  #dots button::after{content:attr(data-l);position:absolute;right:22px;top:50%;transform:translateY(-50%);white-space:nowrap;
    font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.15em;color:#fff;background:rgba(5,15,43,.8);padding:.3rem .6rem;border-radius:6px;
    opacity:0;pointer-events:none;transition:.25s}
  #dots button:hover::after{opacity:1}

  /* ---------- intro ---------- */
  #intro{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 1rem;cursor:pointer;will-change:opacity,transform}
  .intro-kicker{font-family:'Cinzel',serif;letter-spacing:.4em;font-size:.8rem;color:var(--sky)}
  .intro-names{font-family:'Pinyon Script',cursive;color:#fff;font-size:clamp(2.8rem,12vw,4.6rem);margin:.5rem 0 0;
    text-shadow:0 0 25px rgba(143,208,255,.7)}
  .hero-slot{width:min(230px,56vw);margin:.6rem 0}
  .hero-move{will-change:transform}
  .hero{position:relative;width:100%;animation:hover 3.4s ease-in-out infinite}
  .hero::before{content:"";position:absolute;inset:-35%;border-radius:50%;
    background:radial-gradient(circle,rgba(143,208,255,.55),transparent 65%);animation:glow 2.8s ease-in-out infinite}
  .hero svg{position:relative;width:100%;display:block;filter:drop-shadow(0 0 18px rgba(111,177,255,.8))}
  .hero .wings{animation-duration:var(--flap,.9s)}
  @keyframes hover{50%{transform:translateY(-14px)}}
  @keyframes glow{50%{opacity:.45;transform:scale(1.1)}}
  .scroll-cue{margin-top:1.2rem;color:var(--ice);font-style:italic;font-size:1.25rem;letter-spacing:.1em;animation:pulse 1.8s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .mouse{width:26px;height:42px;border:2px solid var(--ice);border-radius:14px;margin:1rem auto 0;position:relative;opacity:.85}
  .mouse::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;
    background:var(--sky);animation:wheel 1.6s infinite}
  @keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(14px)}}

  /* ---------- page 1: invitation card ---------- */
  #page{position:relative;z-index:5}
  #card-wrap{position:relative;padding:0 4vw 6vh;perspective:1400px}
  .card{max-width:620px;margin:0 auto;position:relative;padding:2.4rem 1.6rem 2.6rem;text-align:center;border-radius:10px;
    background:linear-gradient(180deg,#ffffff 0%,var(--card) 40%,#e8f3ff 100%);
    box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 60px rgba(111,177,255,.35);
    transform-origin:50% 0;will-change:transform,opacity;opacity:0}
  .card::before{content:"";position:absolute;inset:10px;border:2px solid var(--silver);border-radius:6px;pointer-events:none}
  .card::after{content:"";position:absolute;inset:16px;border:1px solid var(--sky);border-radius:4px;pointer-events:none;opacity:.6}
  .card>*{position:relative;z-index:1}
  .corner{position:absolute!important;width:50px;z-index:3!important;cursor:pointer;
    transform:rotate(var(--r)) translate(0,0) scale(1);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
  .corner svg{width:100%;display:block}
  .corner .wings{animation-duration:var(--flap,1.6s)}
  .corner:hover{--flap:.12s;transform:rotate(calc(var(--r) + 25deg)) translate(0,-22px) scale(1.25)}
  .corner.tl{--r:-30deg;top:-14px;left:-10px}
  .corner.tr{--r:30deg;top:-14px;right:-10px}
  .corner.bl{--r:-150deg;bottom:-14px;left:-10px}
  .corner.br{--r:150deg;bottom:-14px;right:-10px}

  .reveal{opacity:0;will-change:transform,opacity}
  .blessing{font-style:italic;font-size:1.15rem;color:var(--blue);margin:.6rem 0 1.4rem}
  .kicker{font-family:'Cinzel',serif;letter-spacing:.3em;font-size:.78rem;color:var(--blue)}
  .names{font-family:'Pinyon Script',cursive;font-size:clamp(2.7rem,11vw,4.4rem);color:var(--navy);line-height:1.15;margin:.6rem 0}
  .names .amp{display:block;font-size:.55em;color:var(--sky)}
  .parents{font-size:1.05rem;margin:.3rem 0}
  .divider{margin:1.4rem auto;width:60%;height:14px;position:relative;
    background:linear-gradient(90deg,transparent,var(--sky),transparent) center/100% 1px no-repeat}
  .divider::after{content:"🦋";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#f3f9ff;padding:0 .6rem;font-size:1rem}
  .invite-line{font-size:1.15rem;line-height:1.6;padding:0 .8rem}
  .date{font-family:'Cinzel',serif;color:var(--navy);font-size:1.5rem;letter-spacing:.12em;margin-top:.4rem}
  .date small{display:block;font-size:.8rem;letter-spacing:.3em;color:var(--blue);margin-top:.3rem}
  .countdown{display:flex;justify-content:center;gap:.6rem;margin:1.2rem 0 .2rem}
  .cd{background:linear-gradient(160deg,var(--blue),var(--navy));color:var(--ice);border-radius:10px;min-width:64px;padding:.6rem .3rem;
    box-shadow:0 6px 14px rgba(11,31,77,.3)}
  .cd b{display:block;font-family:'Cinzel',serif;font-size:1.5rem}
  .cd span{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase}
  .events{display:grid;gap:.9rem;margin-top:.8rem;text-align:left}
  .event{display:flex;gap:1rem;align-items:center;padding:.8rem 1rem;border:1px solid var(--silver);border-radius:10px;background:rgba(255,255,255,.7)}
  .event .ico{font-size:1.8rem}
  .event h4{font-family:'Cinzel',serif;color:var(--navy);font-size:1rem;letter-spacing:.1em}
  .event p{font-size:1rem}
  h3.section{font-family:'Cinzel',serif;color:var(--navy);letter-spacing:.25em;font-size:1rem;margin-bottom:.4rem}
  .venue-name{font-size:1.4rem;font-weight:600;color:var(--navy)}
  .btn{display:inline-block;margin:.7rem .3rem 0;padding:.7rem 1.4rem;border-radius:30px;text-decoration:none;font-family:'Cinzel',serif;
    letter-spacing:.15em;font-size:.8rem;border:1px solid var(--blue);color:var(--blue);transition:.3s;cursor:pointer;background:transparent}
  .btn.primary{background:var(--blue);color:#fff}
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(29,79,168,.35)}
  .footer{font-style:italic;margin-top:1.4rem}
  .hearts{color:var(--sky)}
  .more-cue{margin-top:1.2rem;font-family:'Cinzel',serif;letter-spacing:.3em;font-size:.7rem;color:var(--blue)}

  /* ---------- pages 2-6 (dark, on the blue sky) ---------- */
  .page{position:relative;padding:12vh 6vw 6vh;color:var(--ice);text-align:center}
  .page-kicker{font-family:'Cinzel',serif;letter-spacing:.4em;font-size:.8rem;color:var(--sky)}
  .page-title{font-family:'Pinyon Script',cursive;font-size:clamp(2.8rem,9vw,4.6rem);color:#fff;
    text-shadow:0 0 25px rgba(143,208,255,.6);line-height:1.2;margin:.3rem 0}
  .page-sub{font-style:italic;font-size:1.2rem;max-width:520px;margin:.6rem auto 0;color:var(--silver);line-height:1.5}
  .pdiv{display:flex;align-items:center;gap:.8rem;width:min(260px,60%);margin:1.2rem auto}
  .pdiv i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--sky))}
  .pdiv i:last-child{transform:scaleX(-1)}
  .glass{background:rgba(255,255,255,.08);border:1px solid rgba(143,208,255,.3);border-radius:14px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

  /* story timeline */
  .timeline{position:relative;max-width:780px;margin:2.8rem auto 0;text-align:left}
  .tl-track,.tl-line{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px}
  .tl-track{background:rgba(143,208,255,.18)}
  .tl-line{background:linear-gradient(var(--sky),#fff);box-shadow:0 0 12px var(--sky);transform-origin:top;transform:scaleY(0)}
  .tl-item{position:relative;width:50%;padding:0 2.4rem 2.8rem}
  .tl-item.l{text-align:right}
  .tl-item.r{left:50%}
  .tl-dot{position:absolute;top:2px;width:36px;height:36px;filter:drop-shadow(0 0 8px rgba(143,208,255,.9))}
  .tl-item.l .tl-dot{right:-18px}
  .tl-item.r .tl-dot{left:-18px}
  .tl-dot svg{width:100%;display:block;--flap:1.6s}
  .tl-card{padding:1rem 1.2rem}
  .tl-when{font-family:'Cinzel',serif;letter-spacing:.2em;font-size:.72rem;color:var(--sky)}
  .tl-card h4{font-family:'Cinzel',serif;color:#fff;font-size:1.1rem;letter-spacing:.08em;margin:.3rem 0}
  .tl-card p{font-style:italic;font-size:1.08rem;line-height:1.5;color:var(--ice)}
  @media(max-width:700px){
    .tl-track,.tl-line{left:18px;margin-left:0}
    .tl-item,.tl-item.l,.tl-item.r{width:100%;left:0;text-align:left;padding:0 0 2.2rem 3.4rem}
    .tl-item.l .tl-dot,.tl-item.r .tl-dot{left:1px;right:auto}
  }

  /* gallery */
  .gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:1.3rem;max-width:920px;margin:2.6rem auto 0;align-items:start}
  @media(min-width:800px){.gallery{grid-template-columns:repeat(3,1fr);gap:1.8rem}}
  .polaroid{background:#fff;padding:9px 9px 6px;border-radius:4px;box-shadow:0 18px 40px rgba(0,0,0,.45);cursor:pointer;text-align:center;will-change:transform,opacity}
  .ph{overflow:hidden;position:relative;border-radius:2px}
  .ph-img{width:100%;height:100%;object-fit:cover;display:block;will-change:transform}
  .ph-ph{display:flex;align-items:center;justify-content:center}
  .ph-ph svg{width:46%;opacity:.75;--flap:1.8s}
  .cap{font-family:'Pinyon Script',cursive;color:var(--navy);font-size:1.3rem;padding:.35rem 0 .2rem}
  #lb{position:fixed;inset:0;z-index:60;background:rgba(3,10,30,.92);display:none;align-items:center;justify-content:center;cursor:zoom-out;padding:4vw}
  #lb.open{display:flex}
  #lb img{max-width:92vw;max-height:84vh;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.7)}

  /* venue */
  .map-frame{max-width:720px;margin:2rem auto 0;border-radius:16px;overflow:hidden;border:1px solid rgba(143,208,255,.45);
    box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 40px rgba(111,177,255,.25)}
  .map-frame iframe{width:100%;height:340px;border:0;display:block}
  .venue-big{font-family:'Cinzel',serif;font-size:1.4rem;letter-spacing:.1em;color:#fff;margin-top:1.4rem}
  .venue-addr{font-size:1.2rem;margin-top:.2rem}
  .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;max-width:720px;margin:1.6rem auto 0}
  .info{padding:1rem}
  .info .ico{font-size:1.7rem}
  .info h4{font-family:'Cinzel',serif;letter-spacing:.15em;font-size:.9rem;color:#fff;margin:.3rem 0}
  .info p{font-size:1.05rem;line-height:1.4;color:var(--ice)}
  .btn.light{border-color:var(--sky);color:var(--ice)}
  .btn.light.primary{background:linear-gradient(160deg,var(--sky),var(--blue));color:#fff;border-color:transparent}

  /* rsvp */
  .rsvp{max-width:520px;margin:2.4rem auto 0;padding:1.6rem 1.4rem;text-align:left}
  .rsvp label.f{display:block;font-family:'Cinzel',serif;letter-spacing:.2em;font-size:.72rem;color:var(--sky);margin:1rem 0 .35rem}
  .rsvp input[type=text],.rsvp select,.rsvp textarea{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(143,208,255,.4);color:#fff;
    border-radius:10px;padding:.7rem .9rem;font-family:'Cormorant Garamond',serif;font-size:1.15rem;outline:none;transition:.25s}
  .rsvp select option{color:#0b1f4d}
  .rsvp input:focus,.rsvp select:focus,.rsvp textarea:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(111,177,255,.3)}
  .rsvp ::placeholder{color:rgba(223,240,255,.55)}
  .pills{display:flex;gap:.6rem;flex-wrap:wrap}
  .pill{flex:1;min-width:140px;cursor:pointer}
  .pill input{position:absolute;opacity:0;pointer-events:none}
  .pill span{display:block;text-align:center;padding:.7rem .6rem;border:1px solid rgba(143,208,255,.4);border-radius:30px;font-size:1.05rem;transition:.25s}
  .pill input:checked+span{background:linear-gradient(160deg,var(--sky),var(--blue));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(29,79,168,.5)}
  .rsvp .go{width:100%;margin:1.4rem 0 0;padding:.9rem;font-size:.9rem;border:0;background:linear-gradient(160deg,var(--sky),var(--blue));color:#fff;
    border-radius:30px;font-family:'Cinzel',serif;letter-spacing:.2em;cursor:pointer;transition:.3s}
  .rsvp .go:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(29,79,168,.55)}
  #rsvpNote{min-height:1.4rem;margin-top:.8rem;text-align:center;font-style:italic;color:var(--ice)}

  /* thank you */
  #thanks{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .thanks-names{font-family:'Pinyon Script',cursive;font-size:clamp(3.2rem,13vw,6.4rem);color:#fff;line-height:1.1;margin:.6rem 0;
    text-shadow:0 0 35px rgba(143,208,255,.75)}
  .thanks-names .amp{display:block;font-size:.5em;color:var(--sky)}
  .thanks-date{font-family:'Cinzel',serif;letter-spacing:.3em;font-size:.95rem;color:var(--ice);margin-top:.8rem}
  .made{margin-top:3rem;font-size:.95rem;color:var(--silver);opacity:.8}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="bfSymbol" viewBox="0 0 100 100">
      <g class="wings">
        <path d="M50 48 C58 8 100 0 96 36 C94 52 72 56 50 50 Z" fill="var(--c1,#4f9bff)"/>
        <path d="M50 52 C72 58 92 64 82 86 C74 100 54 86 50 54 Z" fill="var(--c2,#2c6fd6)"/>
        <circle cx="80" cy="28" r="6" fill="#fff" opacity=".6"/>
        <circle cx="74" cy="78" r="4" fill="#fff" opacity=".55"/>
        <path d="M50 48 C42 8 0 0 4 36 C6 52 28 56 50 50 Z" fill="var(--c1,#4f9bff)"/>
        <path d="M50 52 C28 58 8 64 18 86 C26 100 46 86 50 54 Z" fill="var(--c2,#2c6fd6)"/>
        <circle cx="20" cy="28" r="6" fill="#fff" opacity=".6"/>
        <circle cx="26" cy="78" r="4" fill="#fff" opacity=".55"/>
      </g>
      <ellipse cx="50" cy="52" rx="3.2" ry="19" fill="#0b1f4d"/>
      <path d="M49 34 C46 20 40 16 36 14 M51 34 C54 20 60 16 64 14" stroke="#0b1f4d" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<div id="bg"></div>
<div id="progress"></div>
<nav id="dots" aria-label="Pages"></nav>
<div id="lb"><img alt=""></div>

<!-- ================= INTRO ================= -->
<div id="intro">
  <div class="intro-kicker">YOU ARE INVITED</div>
  <div class="hero-slot" id="heroSlot">
    <div class="hero-move" id="heroMove">
      <div class="hero"><svg id="heroSvg" viewBox="0 0 100 100" style="--c1:#7ec1ff;--c2:#3b7be0"><use href="#bfSymbol"/></svg></div>
    </div>
  </div>
  <div class="intro-names" id="introNames"></div>
  <div class="scroll-cue">Scroll to open ✦</div>
  <div class="mouse"></div>
</div>

<!-- ================= PAGES ================= -->
<main id="page">
  <div id="spacer"></div>

  <!-- PAGE 1 : invitation card -->
  <div id="card-wrap">
    <div class="card" id="card">
      <div class="corner tl"><svg viewBox="0 0 100 100" style="--c1:#6fb1ff;--c2:#2c6fd6"><use href="#bfSymbol"/></svg></div>
      <div class="corner tr"><svg viewBox="0 0 100 100" style="--c1:#9ad0ff;--c2:#4a8ae6"><use href="#bfSymbol"/></svg></div>
      <div class="corner bl"><svg viewBox="0 0 100 100" style="--c1:#9ad0ff;--c2:#4a8ae6"><use href="#bfSymbol"/></svg></div>
      <div class="corner br"><svg viewBox="0 0 100 100" style="--c1:#6fb1ff;--c2:#2c6fd6"><use href="#bfSymbol"/></svg></div>
      <div id="content"></div>
    </div>
  </div>

  <section class="page" id="story"></section>
  <section class="page" id="gallery"></section>
  <section class="page" id="venue"></section>
  <section class="page" id="rsvp"></section>
  <section class="page" id="thanks"></section>
</main>

<script>
/* =====================================================================
   EDIT YOUR DETAILS HERE — you do not need to touch anything below.
   ===================================================================== */
const WEDDING = {
  groom: "Aarav",
  bride: "Ananya",
  groomParents: "Mr. & Mrs. Mehta",
  brideParents: "Mr. & Mrs. Desai",
  blessing: "With the blessings of the Almighty",
  message: "Together with their families, request the pleasure of your company at the wedding celebration of their children",
  // Main wedding date & time (YYYY-MM-DDTHH:MM, 24-hour)
  dateTime: "2027-03-06T19:00",
  displayDate: "Saturday, 6 March 2027",
  displayTime: "7:00 PM onwards",
  events: [
    { icon:"🌿", name:"Mehndi",    when:"4 Mar 2027 · 4:00 PM",  where:"Garden Lawn" },
    { icon:"💙", name:"Haldi",     when:"5 Mar 2027 · 10:00 AM", where:"Garden Lawn" },
    { icon:"🎶", name:"Sangeet",   when:"5 Mar 2027 · 7:30 PM",  where:"Banquet Hall" },
    { icon:"🦋", name:"Wedding",   when:"6 Mar 2027 · 7:00 PM",  where:"Main Mandap" },
    { icon:"🥂", name:"Reception", when:"7 Mar 2027 · 8:00 PM",  where:"Banquet Hall" }
  ],

  /* ---- PAGE 2 : Our Story (add / remove items freely) ---- */
  story: [
    { when:"SUMMER 2019",   title:"We Met",            text:"A chance hello turned into hours of conversation, and neither of us wanted it to end." },
    { when:"WINTER 2020",   title:"The First Date",    text:"Coffee that stretched into dinner, and a feeling that this was something special." },
    { when:"MONSOON 2023",  title:"The Proposal",      text:"One question, one knee, and the easiest yes of our lives." },
    { when:"EARLY 2027",    title:"Forever Begins",    text:"With our families beside us, we are ready to begin our greatest chapter." }
  ],

  /* ---- PAGE 3 : Gallery (put photo file names or links in src; leave "" for a placeholder) ---- */
  photos: [
    { src:"", caption:"Our first trip" },
    { src:"", caption:"Sunset together" },
    { src:"", caption:"The proposal" },
    { src:"", caption:"With family" },
    { src:"", caption:"Adventures" },
    { src:"", caption:"Always laughing" }
  ],

  /* ---- PAGE 4 : Venue ---- */
  venueName: "The Blue Lagoon Banquets",
  venueAddress: "Vesu, Surat, Gujarat",
  mapQuery: "Vesu, Surat, Gujarat",           // what the embedded map shows
  mapLink: "https://www.google.com/maps/search/?api=1&query=Surat+Gujarat",
  info: [
    { icon:"🚗", title:"PARKING",    text:"Free valet parking is available at the venue." },
    { icon:"🏨", title:"STAY",       text:"Rooms are reserved for out-of-town guests." },
    { icon:"👗", title:"DRESS CODE", text:"Shades of blue, white and pastels." }
  ],

  /* ---- PAGE 5 : RSVP ---- */
  rsvpWhatsApp: "919999999999",   // country code + number, no + or spaces
  rsvpBy: "Please reply by 15 February 2027",

  /* ---- PAGE 6 : Thank you ---- */
  closing: "Your presence will make our day truly special."
};
/* ===================================================================== */

const $ = s => document.querySelector(s);
const clamp = (v,a=0,b=1) => Math.min(b, Math.max(a, v));
const ease = t => t*t*(3-2*t);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const W_ = WEDDING;
document.title = W_.groom + " & " + W_.bride + " – Wedding Invitation";
$("#introNames").textContent = W_.groom + " & " + W_.bride;
const miniBf = (c1,c2) => `<svg viewBox="0 0 100 100" style="--c1:${c1};--c2:${c2}"><use href="#bfSymbol"/></svg>`;
const head = (kicker,title,sub) => `
  <div class="reveal page-kicker">${kicker}</div>
  <h2 class="reveal page-title">${title}</h2>
  <div class="reveal pdiv"><i></i>🦋<i></i></div>
  ${sub ? `<p class="reveal page-sub">${sub}</p>` : ""}`;

/* ----- PAGE 1 : card ----- */
$("#content").innerHTML = `
  <div class="reveal"><div class="blessing">${W_.blessing}</div></div>
  <div class="reveal"><div class="kicker">THE WEDDING OF</div>
    <div class="names">${W_.groom}<span class="amp">&amp;</span>${W_.bride}</div></div>
  <div class="reveal">
    <div class="parents"><i>Son of</i> ${W_.groomParents}</div>
    <div class="parents"><i>Daughter of</i> ${W_.brideParents}</div>
  </div>
  <div class="divider reveal"></div>
  <p class="invite-line reveal">${W_.message}</p>
  <div class="reveal">
    <div class="date">${W_.displayDate}<small>${W_.displayTime}</small></div>
    <div class="countdown" id="countdown"></div>
  </div>
  <div class="divider reveal"></div>
  <div class="reveal"><h3 class="section">CELEBRATIONS</h3></div>
  <div class="events">
    ${W_.events.map((e,i)=>`
      <div class="event reveal" data-dir="${i%2 ? 1 : -1}"><div class="ico">${e.icon}</div>
        <div><h4>${esc(e.name).toUpperCase()}</h4><p>${e.when}<br><i>${e.where}</i></p></div></div>`).join("")}
  </div>
  <div class="divider reveal"></div>
  <div class="reveal">
    <a class="btn" data-goto="venue" href="#venue">📍 VENUE &amp; MAP</a>
    <a class="btn primary" data-goto="rsvp" href="#rsvp">💬 RSVP</a>
    <button class="btn" id="calBtn">📅 ADD TO CALENDAR</button>
  </div>
  <p class="footer reveal">${W_.closing}<br><span class="hearts">♥</span> ${W_.groom} &amp; ${W_.bride} <span class="hearts">♥</span></p>
  <div class="reveal more-cue">SCROLL FOR OUR STORY ↓</div>
`;

/* ----- PAGE 2 : story ----- */
$("#story").innerHTML = head("HOW IT BEGAN","Our Story","Every love story is beautiful, but ours is our favourite.") + `
  <div class="timeline" id="timeline">
    <div class="tl-track"></div><div class="tl-line" id="tlLine"></div>
    ${W_.story.map((s,i)=>`
      <div class="tl-item ${i%2 ? "r" : "l"} reveal" data-dir="${i%2 ? 1 : -1}">
        <div class="tl-dot">${miniBf(i%2?"#9ad0ff":"#6fb1ff", i%2?"#4a8ae6":"#2c6fd6")}</div>
        <div class="tl-card glass"><div class="tl-when">${esc(s.when)}</div><h4>${esc(s.title)}</h4><p>${esc(s.text)}</p></div>
      </div>`).join("")}
  </div>`;

/* ----- PAGE 3 : gallery ----- */
const RATIOS = ["4/5","1/1","3/4","5/4","4/5","1/1","3/4","4/5","1/1"];
const GRADS  = ["#3b7be0,#0f2a66","#6fb1ff,#1d4fa8","#8fd0ff,#2c6fd6","#4f9bff,#0b1f4d","#a9d8ff,#3b7be0","#5b97ee,#14284f"];
$("#gallery").innerHTML = head("MOMENTS","Gallery","A few of our favourite memories.") + `
  <div class="gallery">
    ${W_.photos.map((p,i)=>`
      <figure class="polaroid reveal" data-rot="${[-3,2.5,-1.5,3,-2.5,1.5][i%6]}" data-src="${esc(p.src||"")}">
        <div class="ph" style="aspect-ratio:${RATIOS[i%RATIOS.length]}">
          ${p.src ? `<img class="ph-img" src="${esc(p.src)}" alt="${esc(p.caption||"")}" loading="lazy">`
                  : `<div class="ph-img ph-ph" style="background:linear-gradient(160deg,${GRADS[i%GRADS.length]})">${miniBf("#dff0ff","#8fd0ff")}</div>`}
        </div>
        <figcaption class="cap">${esc(p.caption||"")}</figcaption>
      </figure>`).join("")}
  </div>`;

/* ----- PAGE 4 : venue ----- */
$("#venue").innerHTML = head("WHERE","The Venue","Find your way to the celebration.") + `
  <div class="reveal venue-big">${esc(W_.venueName)}</div>
  <div class="reveal venue-addr">${esc(W_.venueAddress)}</div>
  <div class="reveal map-frame"><iframe loading="lazy" title="Map" referrerpolicy="no-referrer-when-downgrade"
     src="https://maps.google.com/maps?q=${encodeURIComponent(W_.mapQuery)}&output=embed"></iframe></div>
  <div class="info-grid">
    ${W_.info.map((x,i)=>`<div class="info glass reveal" data-dir="${[-1,0,1][i%3]||0}"><div class="ico">${x.icon}</div><h4>${esc(x.title)}</h4><p>${esc(x.text)}</p></div>`).join("")}
  </div>
  <div class="reveal"><a class="btn light primary" href="${W_.mapLink}" target="_blank" rel="noopener">🧭 GET DIRECTIONS</a></div>`;

/* ----- PAGE 5 : RSVP ----- */
$("#rsvp").innerHTML = head("KINDLY REPLY","RSVP", esc(W_.rsvpBy)) + `
  <form class="rsvp glass reveal" id="rsvpForm" autocomplete="off">
    <label class="f" for="rName">YOUR NAME</label>
    <input type="text" id="rName" placeholder="Full name" required>
    <label class="f">WILL YOU JOIN US?</label>
    <div class="pills">
      <label class="pill"><input type="radio" name="att" value="yes" checked><span>Joyfully accept</span></label>
      <label class="pill"><input type="radio" name="att" value="no"><span>Regretfully decline</span></label>
    </div>
    <label class="f" for="rGuests">NUMBER OF GUESTS</label>
    <select id="rGuests">${[1,2,3,4,5,6].map(n=>`<option value="${n}">${n}</option>`).join("")}</select>
    <label class="f" for="rMsg">A MESSAGE FOR THE COUPLE</label>
    <textarea id="rMsg" rows="3" placeholder="Write your wishes…"></textarea>
    <button class="go" type="submit">SEND RSVP ON WHATSAPP</button>
    <div id="rsvpNote"></div>
  </form>`;

/* ----- PAGE 6 : thanks ----- */
$("#thanks").innerHTML = `
  <div class="reveal page-kicker">WITH LOVE &amp; GRATITUDE</div>
  <div class="reveal thanks-names">${esc(W_.groom)}<span class="amp">&amp;</span>${esc(W_.bride)}</div>
  <div class="reveal pdiv"><i></i>🦋<i></i></div>
  <p class="reveal page-sub">${esc(W_.closing)}</p>
  <div class="reveal thanks-date">${esc(W_.displayDate).toUpperCase()}</div>
  <div class="reveal made">See you soon ♥</div>`;

/* ----- countdown ----- */
const target = new Date(W_.dateTime).getTime();
function tick(){
  const d = target - Date.now(), el = $("#countdown");
  if(d <= 0){ el.innerHTML = '<div class="cd" style="min-width:auto;padding:.6rem 1.2rem"><b>Today is the day! 🎉</b></div>'; return; }
  const days = Math.floor(d/864e5), hrs = Math.floor(d%864e5/36e5),
        min = Math.floor(d%36e5/6e4), sec = Math.floor(d%6e4/1e3);
  el.innerHTML = [[days,"Days"],[hrs,"Hours"],[min,"Mins"],[sec,"Secs"]]
    .map(([n,l])=>`<div class="cd"><b>${String(n).padStart(2,"0")}</b><span>${l}</span></div>`).join("");
}
tick(); setInterval(tick,1000);

/* ----- add to calendar ----- */
document.addEventListener("click", e=>{
  if(e.target.id !== "calBtn") return;
  const s = new Date(W_.dateTime), en = new Date(s.getTime()+4*36e5);
  const f = d => d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","BEGIN:VEVENT",
    "SUMMARY:Wedding of "+W_.groom+" & "+W_.bride,
    "DTSTART:"+f(s),"DTEND:"+f(en),
    "LOCATION:"+W_.venueName+", "+W_.venueAddress,
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  a.download = "wedding.ics"; a.click();
});

/* ----- RSVP form -> WhatsApp ----- */
$("#rsvpForm").addEventListener("submit", e=>{
  e.preventDefault();
  const name = $("#rName").value.trim();
  const yes = document.querySelector('input[name=att]:checked').value === "yes";
  const guests = $("#rGuests").value, msg = $("#rMsg").value.trim();
  const text = `Hello! This is ${name}. ` +
    (yes ? `I would love to attend the wedding of ${W_.groom} & ${W_.bride} with ${guests} guest${guests>1?"s":""}.`
         : `Unfortunately I won't be able to attend the wedding of ${W_.groom} & ${W_.bride}, but I wish you both the very best.`) +
    (msg ? `\n\n"${msg}"` : "");
  window.open(`https://wa.me/${W_.rsvpWhatsApp}?text=${encodeURIComponent(text)}`, "_blank");
  $("#rsvpNote").textContent = yes ? "Thank you! Opening WhatsApp… 💙" : "We will miss you. Opening WhatsApp… 💙";
});

/* ----- gallery lightbox (only for photos you added) ----- */
document.addEventListener("click", e=>{
  const p = e.target.closest(".polaroid");
  if(p && p.dataset.src){ $("#lb img").src = p.dataset.src; $("#lb").classList.add("open"); }
  else if(e.target.closest("#lb")) $("#lb").classList.remove("open");
});
addEventListener("keydown", e => { if(e.key === "Escape") $("#lb").classList.remove("open"); });

/* ----- stars ----- */
for(let i=0;i<70;i++){
  const s = document.createElement("div");
  s.className = "star";
  s.style.left = Math.random()*100+"vw"; s.style.top = Math.random()*100+"vh";
  s.style.animationDelay = Math.random()*3+"s";
  s.style.transform = "scale("+(.5+Math.random()*1.2)+")";
  document.body.appendChild(s);
}

/* =====================================================================
   MOUSE — butterflies fly away from the cursor
   ===================================================================== */
const mouse = {x:-9999, y:-9999};
const setMouse = e => { mouse.x = e.clientX; mouse.y = e.clientY; };
addEventListener("pointermove", setMouse);
addEventListener("pointerdown", setMouse);
addEventListener("pointerup",   e => { if(e.pointerType === "touch"){ mouse.x = mouse.y = -9999; } });
document.documentElement.addEventListener("mouseleave", () => { mouse.x = mouse.y = -9999; });

const PALETTE = [["#7ec1ff","#3b7be0"],["#a9d8ff","#5b97ee"],["#4f9bff","#1d4fa8"],["#cfe8ff","#7aa9e6"],["#8fd0ff","#2c6fd6"]];
function createBf(size){
  const [c1,c2] = PALETTE[Math.floor(Math.random()*PALETTE.length)];
  const el = document.createElement("div");
  el.className = "bf";
  el.innerHTML = `<svg viewBox="0 0 100 100" width="${size}" height="${size}" style="--c1:${c1};--c2:${c2}"><use href="#bfSymbol"/></svg>`;
  el.style.filter = "drop-shadow(0 0 6px rgba(143,208,255,.8))";
  document.body.appendChild(el);
  return {el, size};
}
const flies = [];
function makeFly(){
  const o = createBf(24 + Math.random()*26);
  return {...o, x:Math.random()*innerWidth, y:Math.random()*innerHeight, vx:0, vy:0, ang:0,
          tx:0, ty:0, next:0, speed:.9+Math.random()*1.3, phase:Math.random()*6.28, fast:false};
}
const FLY_COUNT = innerWidth < 600 ? 7 : 11;
for(let i=0;i<FLY_COUNT;i++) flies.push(makeFly());

const hero = {ox:0, oy:0, vx:0, vy:0, fast:false};
const heroMove = $("#heroMove"), heroSlot = $("#heroSlot"), heroSvg = $("#heroSvg");
let introVisible = true, last = performance.now();

function loop(now){
  const k = Math.min(2.5, (now-last)/16.667); last = now;
  const W = innerWidth, H = innerHeight, R = 170;
  for(const b of flies){
    if(now > b.next || Math.hypot(b.tx-b.x, b.ty-b.y) < 30){
      b.tx = 30 + Math.random()*(W-60); b.ty = 30 + Math.random()*(H-60);
      b.next = now + 2500 + Math.random()*3500;
    }
    const dx = b.tx-b.x, dy = b.ty-b.y, d = Math.max(1, Math.hypot(dx,dy));
    b.vx += (dx/d*b.speed - b.vx) * .02 * k;
    b.vy += (dy/d*b.speed - b.vy) * .02 * k;
    const mx = b.x-mouse.x, my = b.y-mouse.y, md = Math.max(1, Math.hypot(mx,my));
    const near = md < R;
    if(near){
      const f = 1 - md/R;
      b.vx += (mx/md) * f * 3.4 * k;
      b.vy += (my/md) * f * 3.4 * k;
      b.next = 0;
    }
    const sp = Math.hypot(b.vx,b.vy), max = 12;
    if(sp > max){ b.vx *= max/sp; b.vy *= max/sp; }
    b.x += b.vx*k; b.y += b.vy*k;
    if(b.x < -60) b.x = -60; if(b.x > W+60) b.x = W+60;
    if(b.y < -60) b.y = -60; if(b.y > H+60) b.y = H+60;
    if(sp > .4){
      const ta = Math.atan2(b.vy,b.vx)*180/Math.PI + 90;
      b.ang += (((ta-b.ang+540)%360)-180) * .12 * k;
    }
    if(near !== b.fast){ b.fast = near; b.el.style.setProperty("--flap", near ? ".1s" : ".3s"); }
    const bob = Math.sin(now/300 + b.phase) * 3, off = b.size/2;
    b.el.style.transform = `translate3d(${b.x-off}px,${b.y-off+bob}px,0) rotate(${b.ang}deg)`;
  }
  if(introVisible){
    const r = heroSlot.getBoundingClientRect();
    const cx = r.left + r.width/2 + hero.ox, cy = r.top + r.height/2 + hero.oy;
    const mx = cx-mouse.x, my = cy-mouse.y, md = Math.max(1, Math.hypot(mx,my)), HR = 230;
    const near = md < HR;
    if(near){
      const f = 1 - md/HR;
      hero.vx += (mx/md) * f * 3.2 * k;
      hero.vy += (my/md) * f * 3.2 * k;
    }
    hero.vx += -hero.ox * .018 * k;  hero.vy += -hero.oy * .018 * k;
    const damp = Math.pow(.9, k); hero.vx *= damp; hero.vy *= damp;
    hero.ox = clamp(hero.ox + hero.vx*k, -200, 200);
    hero.oy = clamp(hero.oy + hero.vy*k, -200, 200);
    heroMove.style.transform = `translate3d(${hero.ox}px,${hero.oy}px,0) rotate(${clamp(hero.vx*2.5,-28,28)}deg)`;
    if(near !== hero.fast){ hero.fast = near; heroSvg.style.setProperty("--flap", near ? ".12s" : ".9s"); }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* a flock of butterflies bursts out on the last page */
function burst(){
  const W = innerWidth, H = innerHeight, cx = W/2, cy = H*.55;
  for(let i=0;i<26;i++){
    const o = createBf(24 + Math.random()*30), a = Math.random()*Math.PI*2, d = Math.max(W,H)*(.6+Math.random()*.5);
    const x1 = cx + Math.cos(a)*d, y1 = cy + Math.sin(a)*d, ang = a*180/Math.PI + 90, off = o.size/2;
    o.el.animate([
      {transform:`translate3d(${cx-off}px,${cy-off}px,0) rotate(${ang}deg)`},
      {transform:`translate3d(${x1-off}px,${y1-off}px,0) rotate(${ang}deg)`}
    ],{duration:2200+Math.random()*2200, easing:"cubic-bezier(.3,.1,.4,1)", fill:"forwards"}).onfinish = () => o.el.remove();
  }
}

/* =====================================================================
   SCROLL — every page animates with the scroll wheel
   ===================================================================== */
const intro = $("#intro"), card = $("#card"), cardWrap = $("#card-wrap"), spacer = $("#spacer"), bar = $("#progress");
const reveals = [...document.querySelectorAll(".reveal")];
const parallax = [...document.querySelectorAll(".polaroid")];
const timeline = $("#timeline"), tlLine = $("#tlLine"), thanks = $("#thanks");
function docTop(el){ let y = 0; while(el){ y += el.offsetTop; el = el.offsetParent; } return y; }   // ignores transforms

/* side navigation dots */
const PAGES = [["Invitation",cardWrap],["Our Story",$("#story")],["Gallery",$("#gallery")],["Venue",$("#venue")],["RSVP",$("#rsvp")],["Thank you",thanks]];
const dots = $("#dots");
PAGES.forEach(([label,el])=>{
  const b = document.createElement("button");
  b.dataset.l = label; b.setAttribute("aria-label", label);
  b.onclick = () => scrollTo({top: docTop(el) - (el===cardWrap ? 0 : 20), behavior:"smooth"});
  dots.appendChild(b);
});
document.querySelectorAll("[data-goto]").forEach(a => a.addEventListener("click", e=>{
  e.preventDefault(); scrollTo({top: docTop($("#"+a.dataset.goto)) - 20, behavior:"smooth"});
}));

let burstDone = false;
function update(){
  const sy = scrollY, h = innerHeight;

  // intro fades / grows away
  const pi = clamp(sy / (h*.85));
  introVisible = pi < 1;
  intro.style.opacity = 1 - ease(pi);
  intro.style.transform = `scale(${1 + pi*.2})`;
  intro.style.visibility = introVisible ? "visible" : "hidden";

  // page 1: card unfolds as it enters
  const pc = clamp((sy + h - docTop(cardWrap)) / (h*.95)), e = ease(pc);
  card.style.opacity = clamp(pc*1.8);
  card.style.transform = `translateY(${(1-e)*80}px) rotateX(${(1-e)*-42}deg) scale(${.86 + .14*e})`;

  // every block slides / fades in with the scroll (and back out when scrolling up)
  for(const el of reveals){
    const top = docTop(el) - sy;
    const p = clamp((h*.95 - top) / (h*.3)), q = 1 - ease(p);
    el.style.opacity = p;
    const dir = +el.dataset.dir, rot = el.dataset.rot;
    let t = dir ? `translateX(${dir*q*80}px) scale(${.94+.06*(1-q)})` : `translateY(${q*46}px)`;
    if(rot !== undefined) t = `translateY(${q*70}px) rotate(${+rot + q*(+rot)*2.4}deg) scale(${.9+.1*(1-q)})`;
    el.style.transform = t;
  }

  // gallery photos drift inside their frames
  for(const el of parallax){
    const img = el.querySelector(".ph-img"), ph = el.querySelector(".ph");
    const rel = (docTop(ph) + ph.offsetHeight/2 - sy - h/2) / h;
    img.style.transform = `translateY(${clamp(rel,-1,1)*-7}%) scale(1.2)`;
  }

  // story: the glowing line draws itself down the timeline
  const tp = clamp((sy + h*.62 - docTop(timeline)) / timeline.offsetHeight);
  tlLine.style.transform = `scaleY(${tp})`;

  // side dots + progress line
  let active = 0;
  PAGES.forEach(([,el],i)=>{ if(docTop(el) <= sy + h*.5) active = i; });
  [...dots.children].forEach((b,i)=>b.classList.toggle("on", i===active));
  dots.style.opacity = clamp((sy - h*.5) / (h*.4));
  const max = document.documentElement.scrollHeight - h;
  bar.style.width = (max > 0 ? sy/max*100 : 0) + "%";

  // butterflies burst out once when the last page arrives
  const tt = docTop(thanks);
  if(!burstDone && sy + h*.7 > tt){ burstDone = true; burst(); }
  if(burstDone && sy + h*.3 < tt) burstDone = false;
}
let ticking = false;
function onScroll(){ if(!ticking){ ticking = true; requestAnimationFrame(()=>{ ticking = false; update(); }); } }
function layout(){ spacer.style.height = innerHeight + "px"; update(); }
addEventListener("scroll", onScroll, {passive:true});
addEventListener("resize", layout);
addEventListener("load", layout);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
layout();

intro.addEventListener("click", () => scrollTo({top: innerHeight*1.05, behavior:"smooth"}));
</script>
